name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore
        working-directory: backend

      - name: Build
        run: dotnet build --no-restore --configuration Release
        working-directory: backend

      - name: Test
        run: dotnet test --no-build --configuration Release
        working-directory: backend

  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check migration order
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF"
          git rev-parse --verify --quiet "$base" > /dev/null || { echo "::error::Grana $base nije dostupna."; exit 1; }
          failed=0
          for dir in $(git ls-tree -r --name-only HEAD backend/Modules | grep '/Migrations/' | xargs -r -n1 dirname | sort -u); do
            for added in $(git diff --name-only --diff-filter=A "$base"...HEAD -- "$dir" | grep -E '/[0-9]{14}_[^/]+\.cs$' | grep -v '\.Designer\.cs$'); do
              commit=$(git log --diff-filter=A --format=%H -1 HEAD -- "$added")
              for existing in $(git ls-tree --name-only "$base" -- "$dir/" | grep -E '/[0-9]{14}_[^/]+\.cs$' | grep -v '\.Designer\.cs$'); do
                if ! git cat-file -e "$commit:$existing" 2>/dev/null; then
                  echo "::error file=$added::Migracija ${added##*/} je generisana bez migracije ${existing##*/}, koja je u međuvremenu stigla u granu $BASE_REF. Pratite protokol docs/protocols/migracije-resavanje-konflikata.md."
                  failed=1
                fi
              done
            done
          done
          exit $failed

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
